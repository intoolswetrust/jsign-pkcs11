name: PR builder
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and run tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    if: github.repository_owner == 'intoolswetrust'
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]

    steps:
      - uses: actions/checkout@v4
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      # softhsm.required makes the build fail instead of skipping the SoftHSM2 tests
      - name: Build
        run: mvn -B clean verify -Dsofthsm.required=true

      # The released jar is built with JDK 21, run its tests on the newer JDK too
      - name: Set up JDK 25
        if: matrix.java == 21
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
      - name: Run the JDK 21 build on JDK 25
        if: matrix.java == 21
        run: mvn -B surefire:test -Dsofthsm.required=true
