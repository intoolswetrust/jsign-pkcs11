name: Do Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Version to be released (e.g. 1.2.0, 1.2.0-alpha-1, 1.2.0-beta-1, 1.2.0-M1, 1.2.0-RC-1, 1.2.0.CR1, 1.2.0.Final).'
        required: true
      next-version:
        description: 'Next development version, -SNAPSHOT is appended (e.g. 1.3.0).'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: Flash Gordon
  GIT_AUTHOR_EMAIL: <>
  GIT_COMMITTER_NAME: Terminator the Kitty
  GIT_COMMITTER_EMAIL: <>
  RELEASE_VERSION: ${{ github.event.inputs.release-version }}
  NEXT_VERSION: ${{ github.event.inputs.next-version }}
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  do-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate inputs
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Run the release from main, not $GITHUB_REF."
          RELEASE_VERSION=$(echo "$RELEASE_VERSION" | xargs)
          NEXT_VERSION=$(echo "$NEXT_VERSION" | xargs)
          NEXT_VERSION=${NEXT_VERSION%-SNAPSHOT}
          shopt -s nocasematch
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|M|RC|CR)([.-]?[0-9]+)?|[.-]Final)?$ ]] \
            || fail "Invalid release version '$RELEASE_VERSION', use e.g. 1.2.0, 1.2.0-alpha-1, 1.2.0-beta-1, 1.2.0-M1, 1.2.0-RC-1, 1.2.0.CR1, 1.2.0.Final."
          shopt -u nocasematch
          [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Invalid next version '$NEXT_VERSION', use e.g. 1.3.0."
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            fail "Tag v$RELEASE_VERSION already exists."
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=$NEXT_VERSION-SNAPSHOT" >> "$GITHUB_ENV"
          echo "Releasing $RELEASE_VERSION, next version $NEXT_VERSION-SNAPSHOT"

      - name: Install SoftHSM2 (tests)
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Set up Java and credentials
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the signing key
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          gpg --list-secret-keys --keyid-format long
          KEY=$(mvn help:evaluate -q -Dexpression=gpg.keyname -DforceStdout)
          gpg --list-secret-keys "$KEY" >/dev/null 2>&1 || fail "Key $KEY (gpg.keyname) is not in MAVEN_GPG_PRIVATE_KEY."
          echo test | gpg --batch --pinentry-mode loopback --passphrase "$MAVEN_GPG_PASSPHRASE" \
            --local-user "$KEY" --clearsign >/dev/null || fail "Can't sign with key $KEY, check MAVEN_GPG_PASSPHRASE."
          curl -fsS -o /dev/null "https://keys.openpgp.org/vks/v1/by-fingerprint/$KEY" \
            || curl -fsS -o /dev/null "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$KEY" \
            || fail "Key $KEY is not on keys.openpgp.org nor keyserver.ubuntu.com, Central would reject the signatures."
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set the release version and test
        run: |
          set -euo pipefail
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion="$RELEASE_VERSION"
          git commit -am "Release $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          mvn clean install -Dsofthsm.required=true

      - name: Check main didn't move
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main changed during the release, nothing was deployed. Run the release again."
            exit 1
          fi

      - name: Deploy to Maven Central
        run: mvn deploy -Prelease -DskipTests -DstagingProgressTimeoutMinutes=30
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Push the tag and the next version
        run: |
          set -euo pipefail
          git push origin "v$RELEASE_VERSION"
          mvn versions:set -DgenerateBackupPoms=false -DnewVersion="$NEXT_VERSION"
          git commit -am "Next version is $NEXT_VERSION"
          if ! git push origin HEAD:main; then
            echo "::error::v$RELEASE_VERSION is released and tagged, but main changed in the meantime. Set the version on main to $NEXT_VERSION manually."
            exit 1
          fi
